
name: Build Stride Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android workload
        shell: pwsh
        run: dotnet workload install android

      - name: Detect project
        id: detect
        shell: pwsh
        run: |
          Write-Host "Searching project files..."

          $projects = @(
            Get-ChildItem -Path . -Filter *.csproj -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '[\\/](bin|obj|\.git)[\\/]'
            }
          )

          if ($projects.Count -eq 0) {
            throw "No C# project found. Upload your Stride project files."
          }

          $selected = $null

          foreach ($project in $projects) {
            [xml]$xml = Get-Content $project.FullName -Raw

            $frameworks = @(
              $xml.SelectNodes(
                "//*[local-name()='TargetFramework' or local-name()='TargetFrameworks']"
              ) | ForEach-Object { $_.'#text' }
            )

            Write-Host "Project: $($project.FullName)"
            Write-Host "Frameworks: $frameworks"

            if (($frameworks -join ';') -match 'android') {
              $selected = $project
              break
            }
          }

          if (-not $selected) {
            throw "No Android TargetFramework found. Configure Android target in your Stride project first."
          }

          "PROJECT=$($selected.FullName)" >> $env:GITHUB_OUTPUT

      - name: Publish Android APK
        shell: pwsh
        run: |
          $project = "${{ steps.detect.outputs.PROJECT }}"

          dotnet publish "$project" `
            -c Release `
            -p:AndroidPackageFormat=apk

      - name: Collect APK
        shell: pwsh
        run: |
          $apks = Get-ChildItem . -Filter *.apk -Recurse -File |
            Where-Object {
              $_.FullName -match '[\\/]bin[\\/]Release[\\/]'
            }

          if (-not $apks) {
            throw "APK not generated. Check Android build configuration."
          }

          New-Item -ItemType Directory -Force -Path out/apk |
            Out-Null

          foreach ($apk in $apks) {
            Copy-Item $apk.FullName "out/apk/$($apk.Name)" -Force
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stride-Android-APK
          path: out/apk/*.apk
          if-no-files-found: error
          retention-days: 14
          
